name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Pipeline & dataset tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit + dataset tests
        run: python -m unittest discover -s tests -v

  e2e:
    name: JS unit + browser smoke + a11y
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm test

  lighthouse:
    name: Lighthouse (accessibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
      - run: npm run lighthouse
